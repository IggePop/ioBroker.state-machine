<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="320" height="320" rx="64" fill="url(#bg)"/>

  <!-- start indicator -->
  <circle cx="44" cy="96" r="9" fill="#e2e8f0"/>
  <path d="M55 96 L82 96" stroke="#e2e8f0" stroke-width="6" fill="none" marker-end="url(#arr)"/>

  <!-- transitions -->
  <path d="M128 78 Q 172 40 212 78" stroke="#fbbf24" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arrA)"/>
  <path d="M232 138 L 192 210" stroke="#e2e8f0" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/>
  <path d="M138 222 L 108 140" stroke="#e2e8f0" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/>
  <path d="M212 116 Q 172 140 132 116" stroke="#e2e8f0" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="2 10" marker-end="url(#arr)"/>

  <!-- states -->
  <circle cx="104" cy="98" r="30" fill="#f8fafc"/>
  <circle cx="236" cy="98" r="30" fill="#fbbf24"/>
  <circle cx="236" cy="98" r="38" fill="none" stroke="#fbbf24" stroke-width="4" opacity="0.55"/>
  <circle cx="168" cy="244" r="30" fill="#f8fafc"/>
  <circle cx="168" cy="244" r="22" fill="none" stroke="#0f766e" stroke-width="4"/>

  <!-- state labels -->
  <text x="104" y="107" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#1e3a8a" text-anchor="middle">A</text>
  <text x="236" y="107" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#1e3a8a" text-anchor="middle">B</text>
  <text x="168" y="253" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#1e3a8a" text-anchor="middle">C</text>
</svg>
